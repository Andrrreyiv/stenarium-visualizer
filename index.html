<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Визуализатор стеновых панелей — СТЕНАРИУМ</title>
  <!-- Страница-витрина: на боевом сайте виджет живёт внутри блока Тильды,
       поэтому сброс полей тела страницы держим здесь, а не в стилях виджета. -->
  <style>
    body {
      margin: 0;
      background: #f6f4f1;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
  <!-- Номер счётчика Яндекс.Метрики клиента. Виджет сам счётчик не поднимает:
       при показе через iframe это дало бы лишний просмотр страницы. События
       уходят наверх сообщением, а на странице их принимает мост (deploy/tilda-embed.html).
       Если виджет встроен прямо в страницу, где счётчик уже есть, вызов идёт напрямую. -->
  <script>window.VIZ_METRIKA_ID = 109470426;</script>
  <link rel="stylesheet" href="src/css/viz.css?v=20260805b" />
</head>
<body>
  <div class="viz">
    <p id="viz-error" class="viz-error" hidden></p>

    <div id="viz-scene" class="viz-scene" aria-label="Интерьер с панелями"></div>

    <div class="viz-bar">
      <span id="viz-note" class="viz-note"></span>
      <a id="viz-product" class="viz-btn" hidden target="_blank" rel="noopener">Смотреть в каталоге</a>
      <button id="viz-save" class="viz-btn" type="button">Сохранить картинку</button>
      <button id="viz-reset" class="viz-btn" type="button">Сбросить</button>
    </div>

    <div id="viz-picker" class="viz-picker"></div>
  </div>

  <script type="module" src="src/js/main.browser.js?v=20260805b"></script>
</body>
</html>
