<!-- Вставка визуализатора на страницу Тильды.
     Куда: блок T123 (HTML) на нужной странице.
     Что делает: показывает виджет в рамке и связывает его с Яндекс.Метрикой сайта.

     Почему через рамку, а не кодом прямо на странице: виджет это набор файлов
     (модули, конфиги, 63 текстуры), Тильда такие файлы у себя не держит.

     Почему события Метрики идут через мост: счётчик живёт на самой странице Тильды,
     внутри рамки его нет. Виджет сообщает о действии наверх, мост зовёт ym.
     Свой счётчик внутри рамки поднимать нельзя: это давало бы лишний просмотр
     страницы на каждое открытие визуализатора и портило статистику посещаемости.

     Песочница рамки: виджет лежит на чужом для сайта домене, поэтому ему разрешено
     ровно необходимое. Скрипты и свой origin нужны самому виджету, загрузка для кнопки
     «Сохранить картинку», всплытие окна для ссылки на карточку товара. Увода посетителя
     со страницы песочница при этом не даёт.

     Прокрутку внутри рамки НЕ отключаем намеренно. Высоту подгоняет сообщение от
     виджета, но если оно не дойдёт (блокировщик, ошибка скрипта), с отключённой
     прокруткой низ каталога стал бы недостижим. Так остаётся запасной путь.

     Перед вставкой заменить адрес в VIZ_SRC, если виджет переедет с GitHub Pages. -->

<style>
  /* Отступ сверху нужен ТОЛЬКО там, где шапка сайта закреплена и наезжает на кадр.
     Замер на боевой: при ширине от 980px шапка закреплена и занимает до 100px,
     ниже 980px она обычный блок в потоке и ничего не перекрывает. Поэтому на
     телефоне и планшете отступ маленький, иначе до виджета уходит лишний экран. */
  #viz-embed { max-width: 1400px; margin: 0 auto; padding: 16px 0 32px; }
  @media (min-width: 980px) { #viz-embed { padding: 130px 0 48px; } }
  #viz-frame { display: block; width: 100%; height: 1200px; border: 0; }
</style>

<div id="viz-embed">
  <iframe id="viz-frame"
          src="https://andrrreyiv.github.io/stenarium-visualizer/"
          title="Визуализатор стеновых панелей"
          loading="lazy"
          referrerpolicy="no-referrer"
          sandbox="allow-scripts allow-same-origin allow-downloads allow-popups allow-popups-to-escape-sandbox"></iframe>
</div>

<script>
(function () {
  var VIZ_SRC = 'https://andrrreyiv.github.io';
  var METRIKA_ID = 109470426;
  var frame = document.getElementById('viz-frame');

  window.addEventListener('message', function (e) {
    // Сообщения принимаем ТОЛЬКО от адреса виджета: на странице живут и чужие скрипты.
    if (e.origin !== VIZ_SRC) return;
    var d = e.data;
    if (!d) return;

    if (d.type === 'viz-size' && d.height > 0) {
      frame.style.height = d.height + 'px';
      return;
    }
    // Цели Метрики: viz_open, viz_pick, viz_reset, viz_save, viz_to_product.
    if (d.type === 'viz' && typeof window.ym === 'function') {
      window.ym(METRIKA_ID, 'reachGoal', d.event, d.payload || {});
    }
  });
})();
</script>
